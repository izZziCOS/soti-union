name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1
  # Tests build with the repository texts and a mocked CMS for the news.
  CMS_URL: https://cms.test
  CMS_FETCH_CONTENT: "false"

jobs:
  verify:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run content:sync -- --dry-run > /dev/null
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true # .htaccess
          retention-days: 7

  e2e:
    name: E2E tests (astro preview)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-preview
          path: playwright-report
          retention-days: 7

  apache:
    name: E2E tests (Apache with .htaccess, as on IONOS)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Start Apache
        run: |
          docker run -d --name web -p 8080:80 -v "$PWD/dist:/usr/local/apache2/htdocs:ro" httpd:2.4 \
            sh -c "sed -i -e 's/^#\(LoadModule rewrite_module\)/\1/' -e 's/^#\(LoadModule deflate_module\)/\1/' \
                          -e 's/^#\(LoadModule headers_module\)/\1/' -e 's/AllowOverride None/AllowOverride All/g' \
                          conf/httpd.conf && httpd-foreground"
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          docker logs web
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E tests against Apache
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080
      - name: Apache logs
        if: failure()
        run: docker logs web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-apache
          path: playwright-report
          retention-days: 7
