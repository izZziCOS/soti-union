# Local:      docker compose up --build        → http://localhost:8080
# Production: docker compose pull && docker compose up -d   (uses the image published by CI)
services:
  web:
    image: ghcr.io/izzzicos/soti-union:latest
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
