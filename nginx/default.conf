server_tokens off;

# Permanent redirects for URLs of the previous (2015) site, matched on the original request
# so nginx's internal `index` redirects to /index.html are never caught.
map $request_uri $legacy_redirect {
  default "";
  "~^/(?<lp>(?:lt/|ru/)?)index\.html(?:[?#].*)?$" "/$lp";
  "~^/(?<lp>(?:lt/|ru/)?)news\.html(?:[?#].*)?$" "/${lp}references/aidaprima/";
  "~^/(?<lp>(?:lt/|ru/)?)(?<page>about|references|career|contact)\.html(?:[?#].*)?$" "/$lp$page/";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;

  error_page 404 /404.html;

  if ($legacy_redirect) {
    return 301 $legacy_redirect;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed build output never changes.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:svg|png|ico|txt|xml)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
